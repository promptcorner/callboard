name: PHPUnit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: WordPress test suite (${{ matrix.multisite && 'multisite' || 'single site' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        multisite: [ false, true ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      # Dev dependencies, unlike the E2E job: PHPUnit and the polyfills are the point here.
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The tests run inside the container, against the core PHPUnit library wp-env mounts
      # at /wordpress-phpunit and the same WordPress the E2E suite uses.
      - run: npm run env:start
      - run: npm run test:php
        if: ${{ ! matrix.multisite }}
      # The same suite on a network, with WP_TESTS_MULTISITE=1.
      - run: npm run test:php:multisite
        if: ${{ matrix.multisite }}

      - name: WordPress debug log
        if: ${{ failure() }}
        run: npx wp-env run tests-cli -- cat wp-content/debug.log || true

      - name: Stop the testing environment
        if: ${{ always() }}
        run: npx wp-env stop || true
